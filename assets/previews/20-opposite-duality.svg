<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.token{fill:#f7768e;animation:reverse 4s infinite alternate}@keyframes reverse{to{transform:translateX(220px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(220px)}}</style><rect width="900" height="320" fill="#1a1b26"/><text x="450" y="28" text-anchor="middle">the opposite category reverses arrows and composition order</text><g><text x="220" y="65" text-anchor="middle">C: A -f-&gt; B -g-&gt; C</text><rect class="obj" x="45" y="95" width="100" height="65" rx="14"/><rect class="obj" x="190" y="95" width="100" height="65" rx="14"/><rect class="obj" x="335" y="95" width="100" height="65" rx="14"/><line class="arrow" x1="145" y1="127" x2="190" y2="127"/><line class="arrow" x1="290" y1="127" x2="335" y2="127"/></g><g transform="translate(450 0)"><text x="220" y="65" text-anchor="middle">C op: C -g op-&gt; B -f op-&gt; A</text><rect class="obj" x="45" y="95" width="100" height="65" rx="14"/><rect class="obj" x="190" y="95" width="100" height="65" rx="14"/><rect class="obj" x="335" y="95" width="100" height="65" rx="14"/><line class="arrow" x1="145" y1="127" x2="190" y2="127"/><line class="arrow" x1="290" y1="127" x2="335" y2="127"/></g><text x="450" y="235" text-anchor="middle">transpose twice restores every arrow; [f,g,h] becomes [h,g,f]</text><circle class="token" cx="95" cy="147" r="9"/></svg>