<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.bad{stroke:#f7768e}.token{fill:#f7768e;animation:unfold 3s infinite alternate}@keyframes unfold{to{transform:translateX(510px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(510px)}}</style><rect width="860" height="300" fill="#1a1b26"/><text x="430" y="28" text-anchor="middle">bounded unfold grows a finite sequence from explicit parameters</text><rect class="obj" x="45" y="60" width="190" height="70" rx="14"/><rect class="obj" x="625" y="60" width="190" height="70" rx="14"/><line class="arrow" x1="235" y1="95" x2="625" y2="95"/><text x="140" y="102" text-anchor="middle">seed 3, step 2</text><text x="720" y="102" text-anchor="middle">[3,5,7,9]</text><text x="430" y="82" text-anchor="middle">count 4</text><rect class="obj" x="180" y="205" width="220" height="60" rx="14"/><rect class="obj" x="505" y="205" width="220" height="60" rx="14"/><line class="arrow bad" x1="400" y1="235" x2="505" y2="235"/><text x="290" y="242" text-anchor="middle">irregular [3,5,8,9]</text><text x="615" y="242" text-anchor="middle">regenerates [3,5,7,9]</text><circle class="token" cx="215" cy="115" r="9"/></svg>