<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img"><title>typed cup cap and snake connectivity</title><desc>Coevaluation directs the unit boundary into A and A star outputs. Evaluation directs A star and A inputs into the unit boundary. A green left snake returns A while a blue right snake returns A star; changed endpoints are rejected.</desc><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:monospace;fill:rgb(192,202,245)}.obj{fill:rgb(31,35,53);stroke:rgb(122,162,247);stroke-width:3}.port{fill:rgb(224,175,104);stroke:rgb(26,27,38);stroke-width:2}.arrow{marker-end:url(\23 arrowhead);stroke:rgb(158,206,106);stroke-width:4;fill:none}.other{marker-end:url(\23 arrowhead);stroke:rgb(125,207,255);stroke-width:4;fill:none}.bad{marker-end:url(\23 arrowhead);stroke:rgb(247,118,142);stroke-width:3;stroke-dasharray:10 7;fill:none}.token{fill:rgb(247,118,142);animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(125px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(125px)}}</style><rect width="1120" height="700" fill="rgb(26,27,38)"/><text x="280" y="35" text-anchor="middle">CUP = COEVALUATION, I → A ⊗ A*</text><circle class="port" cx="280" cy="80" r="10"/><text x="280" y="68" text-anchor="middle">I source</text><path class="arrow" d="M280 90C280 155 150 145 150 210"/><path class="arrow" d="M280 90C280 155 410 145 410 210"/><circle class="port" cx="150" cy="220" r="10"/><circle class="port" cx="410" cy="220" r="10"/><text x="150" y="245" text-anchor="middle">A output</text><text x="410" y="245" text-anchor="middle">A* output</text><circle class="token" cx="280" cy="105" r="7"/><text x="840" y="35" text-anchor="middle">CAP = EVALUATION, A* ⊗ A → I</text><circle class="port" cx="710" cy="80" r="10"/><circle class="port" cx="970" cy="80" r="10"/><text x="710" y="68" text-anchor="middle">A* input</text><text x="970" y="68" text-anchor="middle">A input</text><path class="other" d="M710 90C710 155 840 145 840 210"/><path class="other" d="M970 90C970 155 840 145 840 210"/><circle class="port" cx="840" cy="220" r="10"/><text x="840" y="245" text-anchor="middle">I target</text><text x="560" y="295" text-anchor="middle">arrowheads and boundary labels are semantic direction evidence</text><text x="280" y="345" text-anchor="middle">LEFT SNAKE: A → A⊗(A*⊗A) → A</text><rect class="obj" x="40" y="380" width="90" height="55" rx="8"/><rect class="obj" x="195" y="380" width="220" height="55" rx="8"/><rect class="obj" x="485" y="380" width="70" height="55" rx="8"/><text x="85" y="414" text-anchor="middle">A</text><text x="305" y="414" text-anchor="middle">A⊗(A*⊗A)</text><text x="520" y="414" text-anchor="middle">A</text><path class="arrow" d="M130 407H195"/><path class="arrow" d="M415 407H485"/><text x="840" y="345" text-anchor="middle">RIGHT SNAKE: A* → (A*⊗A)⊗A* → A*</text><rect class="obj" x="600" y="380" width="90" height="55" rx="8"/><rect class="obj" x="755" y="380" width="220" height="55" rx="8"/><rect class="obj" x="1040" y="380" width="70" height="55" rx="8"/><text x="645" y="414" text-anchor="middle">A*</text><text x="865" y="414" text-anchor="middle">(A*⊗A)⊗A*</text><text x="1075" y="414" text-anchor="middle">A*</text><path class="other" d="M690 407H755"/><path class="other" d="M975 407H1040"/><text x="560" y="505" text-anchor="middle">distinct connectivity records normalize to their typed identity wires</text><path class="bad" d="M260 565H470"/><text x="365" y="550" text-anchor="middle">broken A endpoint</text><path class="bad" d="M650 565H860"/><text x="755" y="550" text-anchor="middle">broken A* endpoint</text><text x="560" y="635" text-anchor="middle">Lesson 49 checks pairing algebra; Lesson 51 checks port connectivity</text><text x="560" y="675" text-anchor="middle">both layers are required for the diagrammatic reading</text></svg>