<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"><title>finite diagram functors</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:monospace;fill:rgb(192,202,245)}.obj{fill:rgb(31,35,53);stroke:rgb(122,162,247);stroke-width:3}.arrow{marker-end:url(\23 arrowhead);stroke:rgb(158,206,106);stroke-width:4}.component{marker-end:url(\23 arrowhead);stroke:rgb(125,207,255);stroke-width:3}.bad{marker-end:url(\23 arrowhead);stroke:rgb(247,118,142);stroke-width:3;stroke-dasharray:7 6}.token{fill:rgb(247,118,142);animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(500px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(500px)}}</style><rect width="900" height="340" fill="rgb(26,27,38)"/><rect class="obj" x="70" y="50" width="150" height="55" rx="12"/><rect class="obj" x="375" y="50" width="150" height="55" rx="12"/><rect class="obj" x="680" y="50" width="150" height="55" rx="12"/><line class="arrow" x1="220" y1="77" x2="375" y2="77"/><line class="arrow" x1="525" y1="77" x2="680" y2="77"/><rect class="obj" x="70" y="240" width="150" height="55" rx="12"/><rect class="obj" x="375" y="240" width="150" height="55" rx="12"/><rect class="obj" x="680" y="240" width="150" height="55" rx="12"/><line class="arrow" x1="220" y1="267" x2="375" y2="267"/><line class="arrow" x1="525" y1="267" x2="680" y2="267"/><line class="component" x1="145" y1="105" x2="145" y2="240"/><line class="component" x1="450" y1="105" x2="450" y2="240"/><line class="component" x1="755" y1="105" x2="755" y2="240"/><path class="bad" d="M220 92C380 180 520 180 680 92"/><text x="145" y="84" text-anchor="middle">X</text><text x="450" y="84" text-anchor="middle">X</text><text x="755" y="84" text-anchor="middle">X</text><text x="450" y="25" text-anchor="middle">constant / diagonal diagram</text><text x="450" y="325" text-anchor="middle">components compose pointwise</text><circle class="token" cx="195" cy="62" r="8"/></svg>