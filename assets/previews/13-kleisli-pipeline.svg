<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.failed{stroke:#f7768e}.token{fill:#f7768e;animation:pipelineTravel 4s infinite alternate}@keyframes pipelineTravel{to{transform:translateX(600px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(600px)}}</style><rect width="900" height="330" fill="#1a1b26"/><text x="450" y="28" text-anchor="middle">Kleisli composition connects stages that may fail</text><g><rect class="obj" x="40" y="65" width="150" height="65" rx="14"/><rect class="obj" x="300" y="65" width="150" height="65" rx="14"/><rect class="obj" x="560" y="65" width="150" height="65" rx="14"/><rect class="obj" x="760" y="65" width="110" height="65" rx="14"/><line class="arrow" x1="190" y1="97" x2="300" y2="97"/><line class="arrow" x1="450" y1="97" x2="560" y2="97"/><line class="arrow" x1="710" y1="97" x2="760" y2="97"/><text x="115" y="104" text-anchor="middle">input 4</text><text x="375" y="104" text-anchor="middle">positive: 8</text><text x="635" y="104" text-anchor="middle">even: 4</text><text x="815" y="104" text-anchor="middle">+10: 14</text></g><g><rect class="obj" x="40" y="205" width="150" height="65" rx="14"/><rect class="obj" x="300" y="205" width="150" height="65" rx="14"/><line class="arrow failed" x1="190" y1="237" x2="300" y2="237"/><text x="115" y="244" text-anchor="middle">input -1</text><text x="375" y="244" text-anchor="middle">failure: positive</text><text x="600" y="244" text-anchor="middle" fill="#f7768e">later stages do not run</text></g><circle class="token" cx="170" cy="117" r="9"/></svg>