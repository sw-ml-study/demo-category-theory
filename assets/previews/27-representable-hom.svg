<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ece6a"/></marker></defs><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4;marker-end:url(#a)}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(260px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(260px)}}</style><rect width="900" height="320" fill="#1a1b26"/><text x="450" y="28" text-anchor="middle">representables turn composition into hom-set motion</text><rect class="obj" x="45" y="70" width="190" height="70" rx="14"/><rect class="obj" x="355" y="70" width="190" height="70" rx="14"/><rect class="obj" x="665" y="70" width="190" height="70" rx="14"/><line class="arrow" x1="235" y1="105" x2="355" y2="105"/><line class="arrow" x1="665" y1="105" x2="545" y2="105"/><text x="140" y="112" text-anchor="middle">Hom(A,A) = [idA]</text><text x="450" y="112" text-anchor="middle">Hom(A,B) = [f]</text><text x="760" y="112" text-anchor="middle">Hom(B,B) = [idB]</text><text x="295" y="88" text-anchor="middle">postcompose f</text><text x="605" y="88" text-anchor="middle">precompose f</text><rect class="obj" x="220" y="215" width="460" height="65" rx="14"/><text x="450" y="243" text-anchor="middle">identity is universal element</text><text x="450" y="266" text-anchor="middle">selected f factors through exactly one arrow: f</text><circle class="token" cx="215" cy="125" r="9"/></svg>