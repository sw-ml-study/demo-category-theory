<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.bad{stroke:#f7768e}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translate(260px,120px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translate(260px,120px)}}</style><rect width="820" height="300" fill="#1a1b26"/><text x="410" y="28" text-anchor="middle">pullback joins rows whose projected keys agree</text><rect class="obj" x="70" y="55" width="180" height="65" rx="12"/><rect class="obj" x="570" y="55" width="180" height="65" rx="12"/><rect class="obj" x="70" y="205" width="180" height="65" rx="12"/><rect class="obj" x="570" y="205" width="180" height="65" rx="12"/><line class="arrow" x1="250" y1="87" x2="570" y2="87"/><line class="arrow" x1="160" y1="120" x2="160" y2="205"/><line class="arrow" x1="660" y1="120" x2="660" y2="205"/><line class="arrow bad" x1="250" y1="237" x2="570" y2="237"/><text x="160" y="94" text-anchor="middle">join pairs</text><text x="660" y="94" text-anchor="middle">right rows</text><text x="160" y="244" text-anchor="middle">left rows</text><text x="660" y="244" text-anchor="middle">keys [10,20]</text><circle class="token" cx="140" cy="100" r="9"/></svg>