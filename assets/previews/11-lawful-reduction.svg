<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="850" height="330" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translateY(80px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateY(80px)}}</style><rect width="850" height="330" fill="#1a1b26"/><text x="425" y="28" text-anchor="middle">associativity turns a serial fold into a parallel tree</text><g><text x="210" y="60" text-anchor="middle">serial: (((8+4)+2)+1) = 15</text><rect class="obj" x="55" y="90" width="310" height="150" rx="14"/><text x="210" y="150" text-anchor="middle">8 + 4 -&gt; 12 -&gt; 14 -&gt; 15</text><line class="arrow" x1="100" y1="190" x2="320" y2="190"/></g><g><text x="640" y="60" text-anchor="middle">parallel: (8+4) + (2+1) = 15</text><rect class="obj" x="485" y="90" width="310" height="150" rx="14"/><text x="565" y="145">8+4=12</text><text x="685" y="145">2+1=3</text><text x="640" y="210" text-anchor="middle">12+3=15</text><line class="arrow" x1="565" y1="160" x2="625" y2="200"/><line class="arrow" x1="715" y1="160" x2="655" y2="200"/><circle class="token" cx="565" cy="120" r="9"/></g><text x="425" y="290" text-anchor="middle">subtraction warns why the law matters: serial 1, regrouped 3</text></svg>