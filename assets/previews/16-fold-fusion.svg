<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.token{fill:#f7768e;animation:fold 3s infinite alternate}@keyframes fold{to{transform:translateX(500px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(500px)}}</style><rect width="860" height="300" fill="#1a1b26"/><text x="430" y="28" text-anchor="middle">linear map fuses with finite additive consumption</text><rect class="obj" x="40" y="65" width="190" height="70" rx="14"/><rect class="obj" x="335" y="65" width="190" height="70" rx="14"/><rect class="obj" x="650" y="65" width="170" height="70" rx="14"/><line class="arrow" x1="230" y1="100" x2="335" y2="100"/><line class="arrow" x1="525" y1="100" x2="650" y2="100"/><text x="135" y="107" text-anchor="middle">[2,4,6,8]</text><text x="430" y="107" text-anchor="middle">double each</text><text x="735" y="107" text-anchor="middle">sum = 40</text><rect class="obj" x="250" y="205" width="360" height="60" rx="14"/><text x="430" y="242" text-anchor="middle">2 * sum([2,4,6,8]) = 40</text><circle class="token" cx="210" cy="120" r="9"/></svg>