<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(450px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(450px)}}</style><rect width="800" height="280" fill="#1a1b26"/><text x="400" y="30" text-anchor="middle">identity and composition keep structure-preserving arrows inside the category</text><rect class="obj" x="55" y="90" width="160" height="100" rx="14"/><rect class="obj" x="320" y="90" width="160" height="100" rx="14"/><rect class="obj" x="585" y="90" width="160" height="100" rx="14"/><line class="arrow" x1="215" y1="140" x2="320" y2="140"/><line class="arrow" x1="480" y1="140" x2="585" y2="140"/><text x="135" y="145" text-anchor="middle">Z4</text><text x="400" y="145" text-anchor="middle">Z4</text><text x="665" y="145" text-anchor="middle">Z2</text><text x="267" y="125">id</text><text x="532" y="125">parity</text><circle class="token" cx="195" cy="165" r="10"/></svg>