<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.bad{stroke:#f7768e}.token{fill:#f7768e;animation:endpoint 3s infinite alternate}@keyframes endpoint{to{transform:translateX(180px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(180px)}}</style><rect width="900" height="340" fill="#1a1b26"/><text x="450" y="28" text-anchor="middle">universal endpoints are defined by unique arrows</text><rect class="obj" x="45" y="65" width="150" height="70" rx="14"/><rect class="obj" x="330" y="65" width="150" height="70" rx="14"/><rect class="obj" x="705" y="65" width="150" height="70" rx="14"/><line class="arrow" x1="195" y1="100" x2="330" y2="100"/><line class="arrow" x1="480" y1="100" x2="705" y2="100"/><text x="120" y="107" text-anchor="middle">empty: initial</text><text x="405" y="107" text-anchor="middle">any finite X</text><text x="780" y="107" text-anchor="middle">singleton: terminal</text><rect class="obj" x="150" y="220" width="190" height="75" rx="14"/><rect class="obj" x="560" y="220" width="190" height="75" rx="14"/><line class="arrow" x1="340" y1="245" x2="560" y2="245"/><line class="arrow bad" x1="560" y1="275" x2="340" y2="275"/><text x="245" y="264" text-anchor="middle">zero object 0</text><text x="655" y="264" text-anchor="middle">pointed object A</text><text x="450" y="320" text-anchor="middle">0 is both initial and terminal; ordinary FinSet has no zero object</text><circle class="token" cx="175" cy="120" r="9"/></svg>