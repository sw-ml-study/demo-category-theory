<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>strictness versus coherent isomorphism</title><desc>Two differently parenthesized tensor records are not literally equal. Green associator arrows connect them in both directions and compose to identity loops. A dashed red reverse map swaps payloads and is not inverse.</desc><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:monospace;fill:rgb(192,202,245)}.obj{fill:rgb(31,35,53);stroke:rgb(122,162,247);stroke-width:3}.arrow{marker-end:url(\23 arrowhead);stroke:rgb(158,206,106);stroke-width:4;fill:none}.bad{marker-end:url(\23 arrowhead);stroke:rgb(247,118,142);stroke-width:4;stroke-dasharray:10 7}.token{fill:rgb(247,118,142);animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(490px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(490px)}}</style><rect width="1000" height="420" fill="rgb(26,27,38)"/><text x="500" y="35" text-anchor="middle">NOT STRICT: PARENTHESES ARE DIFFERENT RECORD SHAPES</text><rect class="obj" x="70" y="110" width="260" height="95" rx="14"/><rect class="obj" x="670" y="110" width="260" height="95" rx="14"/><text x="200" y="148" text-anchor="middle">((2⊗3)⊗5)</text><text x="200" y="180" text-anchor="middle">left.left exists</text><text x="800" y="148" text-anchor="middle">(2⊗(3⊗5))</text><text x="800" y="180" text-anchor="middle">right.right exists</text><path class="arrow" d="M330 135H670"/><path class="arrow" d="M670 185H330"/><text x="500" y="122" text-anchor="middle">associator α</text><text x="500" y="213" text-anchor="middle">inverse α⁻¹</text><circle class="token" cx="325" cy="150" r="8"/><text x="500" y="275" text-anchor="middle">α⁻¹∘α = id AND α∘α⁻¹ = id</text><line class="bad" x1="720" y1="315" x2="300" y2="315"/><text x="500" y="350" text-anchor="middle">BAD REVERSE: ((2⊗5)⊗3) ≠ ((2⊗3)⊗5)</text><text x="500" y="392" text-anchor="middle">coherently isomorphic does not mean literally equal</text></svg>