<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(420px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(420px)}}</style><rect width="800" height="330" fill="#1a1b26"/><text x="400" y="28" text-anchor="middle">scalar arrows and lifted array arrows move together</text><rect class="obj" x="80" y="55" width="160" height="65" rx="14"/><rect class="obj" x="560" y="55" width="160" height="65" rx="14"/><rect class="obj" x="80" y="220" width="160" height="65" rx="14"/><rect class="obj" x="560" y="220" width="160" height="65" rx="14"/><line class="arrow" x1="240" y1="87" x2="560" y2="87"/><line class="arrow" x1="240" y1="252" x2="560" y2="252"/><text x="400" y="75" text-anchor="middle">g after f</text><text x="400" y="240" text-anchor="middle">each(g) after each(f)</text><text x="160" y="93" text-anchor="middle">1</text><text x="640" y="93" text-anchor="middle">4</text><text x="160" y="258" text-anchor="middle">[1,2,3]</text><text x="640" y="258" text-anchor="middle">[4,6,8]</text><circle class="token" cx="220" cy="105" r="9"/></svg>