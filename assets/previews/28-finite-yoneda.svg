<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ece6a"/></marker></defs><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4;marker-end:url(#a)}.bad{stroke:#f7768e}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(250px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(250px)}}</style><rect width="900" height="340" fill="#1a1b26"/><text x="450" y="28" text-anchor="middle">one element determines one natural transformation</text><rect class="obj" x="40" y="65" width="190" height="70" rx="14"/><rect class="obj" x="355" y="65" width="190" height="70" rx="14"/><rect class="obj" x="670" y="65" width="190" height="70" rx="14"/><line class="arrow" x1="230" y1="100" x2="355" y2="100"/><line class="arrow" x1="545" y1="100" x2="670" y2="100"/><text x="135" y="107" text-anchor="middle">element 10 in F(A)</text><text x="450" y="92" text-anchor="middle">eta: idA-&gt;10</text><text x="450" y="116" text-anchor="middle">eta: f-&gt;20</text><text x="765" y="107" text-anchor="middle">evaluate at idA: 10</text><rect class="obj" x="140" y="225" width="220" height="70" rx="14"/><rect class="obj" x="540" y="225" width="220" height="70" rx="14"/><line class="arrow" x1="360" y1="260" x2="540" y2="260"/><text x="250" y="267" text-anchor="middle">(A,10)</text><text x="650" y="267" text-anchor="middle">(B,20)</text><text x="450" y="245" text-anchor="middle">element arrow over f</text><circle class="token" cx="210" cy="120" r="9"/></svg>