<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"><title>finite Yoneda correspondence in three stages</title><desc>Choose 10 in F(A), verify the naturality square for eta, then recover 10 by evaluating eta at identity A. A dashed 21 is the counterexample.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:3;marker-end:url(#a)}.bad{stroke:#f7768e;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#a)}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(100px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(100px)}}</style><rect width="900" height="400" fill="#1a1b26"/><text x="110" y="28" text-anchor="middle">1 CHOOSE x</text><rect class="obj" x="25" y="55" width="170" height="65" rx="12"/><text x="110" y="83" text-anchor="middle">x=10 in F(A)</text><circle class="token" cx="55" cy="108" r="8"/><text x="540" y="28" text-anchor="middle">2 GENERATE eta; CHECK NATURALITY</text><rect class="obj" x="260" y="55" width="180" height="58" rx="10"/><rect class="obj" x="630" y="55" width="180" height="58" rx="10"/><rect class="obj" x="260" y="205" width="180" height="58" rx="10"/><rect class="obj" x="630" y="205" width="180" height="58" rx="10"/><text x="350" y="90" text-anchor="middle">Hom(A,A)=[idA]</text><text x="720" y="90" text-anchor="middle">F(A)=[10]</text><text x="350" y="240" text-anchor="middle">Hom(A,B)=[f]</text><text x="720" y="240" text-anchor="middle">F(B)=[20]</text><line class="arrow" x1="440" y1="84" x2="630" y2="84"/><line class="arrow" x1="440" y1="234" x2="630" y2="234"/><line class="arrow" x1="350" y1="113" x2="350" y2="205"/><line class="arrow" x1="720" y1="113" x2="720" y2="205"/><text x="535" y="72" text-anchor="middle">eta_A(idA)=10</text><text x="535" y="222" text-anchor="middle">eta_B(f)=20</text><text x="290" y="162">postcompose f</text><text x="735" y="162">F(f)</text><path class="bad" d="M810 234H875"/><text x="842" y="220" text-anchor="middle">BROKEN 21</text><text x="535" y="292" text-anchor="middle">both routes reach 20: COMMUTES</text><text x="450" y="330" text-anchor="middle">3 RECOVER x BY EVALUATION</text><rect class="obj" x="285" y="345" width="330" height="42" rx="10"/><text x="450" y="372" text-anchor="middle">eta_A(id_A) = 10 = x</text></svg>