<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.bad{stroke:#f7768e}.token{fill:#f7768e;animation:lens 3s infinite alternate}@keyframes lens{to{transform:translateX(480px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(480px)}}</style><rect width="900" height="330" fill="#1a1b26"/><text x="450" y="28" text-anchor="middle">a lawful lens changes one focus and preserves its surroundings</text><rect class="obj" x="35" y="60" width="250" height="100" rx="14"/><rect class="obj" x="615" y="60" width="250" height="100" rx="14"/><line class="arrow" x1="285" y1="110" x2="615" y2="110"/><text x="160" y="95" text-anchor="middle">rate 0.01</text><text x="160" y="125" text-anchor="middle">batch 32, version 3</text><text x="740" y="95" text-anchor="middle">rate 0.02</text><text x="740" y="125" text-anchor="middle">batch 32, version 3</text><text x="450" y="92" text-anchor="middle">set focus</text><rect class="obj" x="170" y="220" width="240" height="75" rx="14"/><rect class="obj" x="530" y="220" width="240" height="75" rx="14"/><line class="arrow bad" x1="410" y1="257" x2="530" y2="257"/><text x="290" y="265" text-anchor="middle">get-put expects batch 32</text><text x="650" y="265" text-anchor="middle">broken setter resets batch 1</text><circle class="token" cx="265" cy="130" r="9"/></svg>