<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.token{fill:#f7768e;animation:join 3s infinite alternate}@keyframes join{to{transform:translateX(350px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(350px)}}</style><rect width="860" height="300" fill="#1a1b26"/><text x="430" y="28" text-anchor="middle">independent results combine only after both contexts succeed</text><rect class="obj" x="55" y="65" width="220" height="70" rx="14"/><rect class="obj" x="55" y="185" width="220" height="70" rx="14"/><rect class="obj" x="590" y="115" width="220" height="90" rx="14"/><line class="arrow" x1="275" y1="100" x2="590" y2="145"/><line class="arrow" x1="275" y1="220" x2="590" y2="175"/><text x="165" y="107" text-anchor="middle">row count: success 120</text><text x="165" y="227" text-anchor="middle">threshold: success 0.8</text><text x="700" y="155" text-anchor="middle">product</text><text x="700" y="182" text-anchor="middle">{120, 0.8}</text><circle class="token" cx="255" cy="120" r="9"/></svg>