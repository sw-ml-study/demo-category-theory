<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.bad{stroke:#f7768e}.token{fill:#f7768e;animation:triangle 4s infinite alternate}@keyframes triangle{to{transform:translateX(560px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(560px)}}</style><rect width="900" height="340" fill="#1a1b26"/><text x="450" y="28" text-anchor="middle">diagonal duplication is left adjoint to product</text><rect class="obj" x="35" y="60" width="170" height="70" rx="14"/><rect class="obj" x="345" y="60" width="210" height="70" rx="14"/><rect class="obj" x="695" y="60" width="170" height="70" rx="14"/><line class="arrow" x1="205" y1="95" x2="345" y2="95"/><line class="arrow" x1="555" y1="95" x2="695" y2="95"/><text x="120" y="102" text-anchor="middle">product (3,5)</text><text x="450" y="88" text-anchor="middle">((3,5),(3,5))</text><text x="450" y="113" text-anchor="middle">unit: duplicate</text><text x="780" y="102" text-anchor="middle">counit: (3,5)</text><rect class="obj" x="170" y="225" width="240" height="70" rx="14"/><rect class="obj" x="530" y="225" width="200" height="70" rx="14"/><line class="arrow bad" x1="410" y1="260" x2="530" y2="260"/><text x="290" y="267" text-anchor="middle">bad counit selects left twice</text><text x="630" y="267" text-anchor="middle">actual (3,3)</text><circle class="token" cx="185" cy="115" r="9"/></svg>