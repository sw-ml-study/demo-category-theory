<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4;marker-end:url(#a)}.token{fill:#f7768e;animation:travel 3s ease-in-out infinite alternate}@keyframes travel{to{transform:translateX(480px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(480px)}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ece6a"/></marker></defs><rect width="760" height="260" fill="#1a1b26"/><rect class="obj" x="80" y="80" width="150" height="90" rx="16"/><text x="80" y="125" text-anchor="middle" dx="75" font-size="20">Numbers</text><rect class="obj" x="530" y="80" width="150" height="90" rx="16"/><text x="530" y="125" text-anchor="middle" dx="75" font-size="20">Numbers</text><line class="arrow" x1="230" y1="125" x2="530" y2="125"/><text x="380" y="105" text-anchor="middle" font-size="18">double</text><circle class="token" cx="210" cy="145" r="12"/><text x="80" y="35" font-size="19">One input keeps its identity while its value changes: 3 -&gt; 6</text></svg>