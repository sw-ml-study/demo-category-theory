<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4;marker-end:url(#a)}.token{fill:#f7768e;animation:travel 3s ease-in-out infinite alternate}@keyframes travel{to{transform:translateX(480px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(480px)}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ece6a"/></marker></defs><rect width="760" height="260" fill="#1a1b26"/><text x="30" y="30" font-size="18">(f ; g) ; h and f ; (g ; h) visit the same objects and finish together</text><rect class="obj" x="35" y="90" width="120" height="70" rx="14"/><rect class="obj" x="220" y="90" width="120" height="70" rx="14"/><rect class="obj" x="405" y="90" width="120" height="70" rx="14"/><rect class="obj" x="590" y="90" width="120" height="70" rx="14"/><text x="95" y="130" text-anchor="middle">A</text><text x="280" y="130" text-anchor="middle">B</text><text x="465" y="130" text-anchor="middle">C</text><text x="650" y="130" text-anchor="middle">D</text><line class="arrow" x1="155" y1="125" x2="220" y2="125"/><line class="arrow" x1="340" y1="125" x2="405" y2="125"/><line class="arrow" x1="525" y1="125" x2="590" y2="125"/><text x="188" y="108">f</text><text x="373" y="108">g</text><text x="558" y="108">h</text><circle class="token" cx="140" cy="145" r="12"/></svg>