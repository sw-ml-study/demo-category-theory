<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4;marker-end:url(#a)}.token{fill:#f7768e;animation:travel 3s ease-in-out infinite alternate}@keyframes travel{to{transform:translateX(480px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(480px)}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ece6a"/></marker></defs><rect width="760" height="260" fill="#1a1b26"/><text x="190" y="24" text-anchor="middle">LEFT: compose(compose(f,g),h)</text><text x="570" y="24" text-anchor="middle">RIGHT: compose(f,compose(g,h))</text><g><rect class="obj" x="130" y="45" width="120" height="42" rx="10"/><text x="190" y="72" text-anchor="middle">compose</text><line class="arrow" x1="170" y1="87" x2="115" y2="125"/><line class="arrow" x1="210" y1="87" x2="270" y2="125"/><rect class="obj" x="55" y="125" width="120" height="42" rx="10"/><text x="115" y="152" text-anchor="middle">compose</text><text x="270" y="152" text-anchor="middle">h</text><text x="75" y="205">f</text><text x="145" y="205">g</text><line class="arrow" x1="95" y1="167" x2="75" y2="190"/><line class="arrow" x1="135" y1="167" x2="145" y2="190"/></g><g><rect class="obj" x="510" y="45" width="120" height="42" rx="10"/><text x="570" y="72" text-anchor="middle">compose</text><line class="arrow" x1="550" y1="87" x2="490" y2="125"/><line class="arrow" x1="590" y1="87" x2="650" y2="125"/><text x="490" y="152" text-anchor="middle">f</text><rect class="obj" x="590" y="125" width="120" height="42" rx="10"/><text x="650" y="152" text-anchor="middle">compose</text><text x="620" y="205">g</text><text x="690" y="205">h</text><line class="arrow" x1="630" y1="167" x2="620" y2="190"/><line class="arrow" x1="670" y1="167" x2="690" y2="190"/></g><text x="380" y="232" text-anchor="middle">BOTH EVALUATE THE SAME PATH</text><text x="85" y="258">A</text><text x="270" y="258">B</text><text x="455" y="258">C</text><text x="640" y="258">D</text><line class="arrow" x1="105" y1="252" x2="250" y2="252"/><line class="arrow" x1="290" y1="252" x2="435" y2="252"/><line class="arrow" x1="475" y1="252" x2="620" y2="252"/><text x="178" y="244">f</text><text x="363" y="244">g</text><text x="548" y="244">h</text><circle class="token" cx="100" cy="270" r="10"/></svg>