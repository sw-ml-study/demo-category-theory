<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{fill:none;stroke:#9ece6a;stroke-width:4}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translate(0,100px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translate(0,100px)}}</style><rect width="760" height="300" fill="#1a1b26"/><text x="380" y="28" text-anchor="middle" font-size="19">two projections force one pair</text><rect class="obj" x="305" y="55" width="150" height="65" rx="14"/><rect class="obj" x="90" y="210" width="150" height="65" rx="14"/><rect class="obj" x="520" y="210" width="150" height="65" rx="14"/><path class="arrow" d="M330 120L210 210M430 120L550 210"/><text x="255" y="160">fst = 3</text><text x="470" y="160">snd = 8</text><text x="380" y="93" text-anchor="middle">pair(3,8)</text><text x="165" y="247" text-anchor="middle">3</text><text x="595" y="247" text-anchor="middle">8</text><circle class="token" cx="380" cy="105" r="10"/></svg>