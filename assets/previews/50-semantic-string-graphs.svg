<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img"><title>semantic string graphs and interchange</title><desc>Two visibly different embeddings share the same directed typed edge list. Below, sequential then tensor and tensor then sequential have different intermediate groupings but the same four-box endpoint. Coordinates narrate the bounded movement; edge data and endpoint tables provide executable evidence.</desc><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:monospace;fill:rgb(192,202,245)}.obj{fill:rgb(31,35,53);stroke:rgb(122,162,247);stroke-width:3}.port{fill:rgb(224,175,104);stroke:rgb(26,27,38);stroke-width:2}.arrow{marker-end:url(\23 arrowhead);stroke:rgb(158,206,106);stroke-width:4;fill:none}.other{marker-end:url(\23 arrowhead);stroke:rgb(125,207,255);stroke-width:4;fill:none}.bad{marker-end:url(\23 arrowhead);stroke:rgb(247,118,142);stroke-width:3;stroke-dasharray:10 7;fill:none}.token{fill:rgb(247,118,142);animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(150px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(150px)}}</style><rect width="1160" height="720" fill="rgb(26,27,38)"/><text x="290" y="32" text-anchor="middle">EMBEDDING 1 — STRAIGHT</text><rect class="obj" x="55" y="105" width="140" height="70" rx="10"/><rect class="obj" x="390" y="105" width="140" height="70" rx="10"/><text x="125" y="147" text-anchor="middle">f : A→B</text><text x="460" y="147" text-anchor="middle">g : B→C</text><circle class="port" cx="195" cy="140" r="8"/><circle class="port" cx="390" cy="140" r="8"/><path class="arrow" d="M203 140H382"/><text x="292" y="126" text-anchor="middle">B output → B input</text><circle class="token" cx="215" cy="140" r="7"/><text x="870" y="32" text-anchor="middle">EMBEDDING 2 — BOXES MOVED</text><rect class="obj" x="625" y="75" width="140" height="70" rx="10"/><rect class="obj" x="960" y="175" width="140" height="70" rx="10"/><text x="695" y="117" text-anchor="middle">f : A→B</text><text x="1030" y="217" text-anchor="middle">g : B→C</text><circle class="port" cx="765" cy="110" r="8"/><circle class="port" cx="960" cy="210" r="8"/><path class="other" d="M773 110C850 110 875 210 952 210"/><text x="870" y="150" text-anchor="middle">same edge 0→1, type B</text><text x="580" y="290" text-anchor="middle">coordinates differ; checked typed edge table [[0,1,"B"]] is identical</text><text x="580" y="350" text-anchor="middle">INTERCHANGE: TWO CONSTRUCTION ORDERS</text><text x="285" y="390" text-anchor="middle">(g after f) ⊗ (k after h)</text><rect class="obj" x="50" y="425" width="110" height="60" rx="8"/><rect class="obj" x="220" y="425" width="110" height="60" rx="8"/><rect class="obj" x="50" y="525" width="110" height="60" rx="8"/><rect class="obj" x="220" y="525" width="110" height="60" rx="8"/><text x="105" y="462" text-anchor="middle">f</text><text x="275" y="462" text-anchor="middle">g</text><text x="105" y="562" text-anchor="middle">h</text><text x="275" y="562" text-anchor="middle">k</text><path class="arrow" d="M160 455H220"/><path class="arrow" d="M160 555H220"/><text x="870" y="390" text-anchor="middle">(g ⊗ k) after (f ⊗ h)</text><rect class="obj" x="645" y="425" width="110" height="60" rx="8"/><rect class="obj" x="925" y="425" width="110" height="60" rx="8"/><rect class="obj" x="645" y="525" width="110" height="60" rx="8"/><rect class="obj" x="925" y="525" width="110" height="60" rx="8"/><text x="700" y="462" text-anchor="middle">f</text><text x="980" y="462" text-anchor="middle">g</text><text x="700" y="562" text-anchor="middle">h</text><text x="980" y="562" text-anchor="middle">k</text><path class="other" d="M755 455H925"/><path class="other" d="M755 555H925"/><path class="other" d="M700 485V525"/><path class="other" d="M980 485V525"/><text x="580" y="635" text-anchor="middle">different grouping records; same endpoint outputs [4,8]</text><path class="bad" d="M420 675H740"/><text x="580" y="705" text-anchor="middle">changed edge or endpoint is rejected</text></svg>