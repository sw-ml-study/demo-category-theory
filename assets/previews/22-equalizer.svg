<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.bad{stroke:#f7768e}.token{fill:#f7768e;animation:eqz 3s infinite alternate}@keyframes eqz{to{transform:translateX(410px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(410px)}}</style><rect width="880" height="320" fill="#1a1b26"/><text x="440" y="28" text-anchor="middle">equalizer keeps exactly the inputs where parallel arrows agree</text><rect class="obj" x="40" y="80" width="160" height="75" rx="14"/><rect class="obj" x="350" y="80" width="190" height="75" rx="14"/><rect class="obj" x="690" y="80" width="150" height="75" rx="14"/><line class="arrow" x1="200" y1="117" x2="350" y2="117"/><line class="arrow" x1="540" y1="100" x2="690" y2="100"/><line class="arrow" x1="540" y1="135" x2="690" y2="135"/><text x="120" y="124" text-anchor="middle">E = [0,2]</text><text x="445" y="124" text-anchor="middle">A = [0,1,2,3]</text><text x="765" y="124" text-anchor="middle">B</text><text x="615" y="88">f</text><text x="615" y="153">g</text><rect class="obj" x="250" y="225" width="380" height="60" rx="14"/><line class="arrow bad" x1="440" y1="205" x2="440" y2="225"/><text x="440" y="262" text-anchor="middle">bad mediator includes 1 where f(1) != g(1)</text><circle class="token" cx="180" cy="137" r="9"/></svg>