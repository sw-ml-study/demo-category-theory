<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.failed{stroke:#f7768e}.token{fill:#f7768e;animation:contextTravel 3s infinite alternate}@keyframes contextTravel{to{transform:translateX(430px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(430px)}}</style><rect width="820" height="300" fill="#1a1b26"/><text x="410" y="28" text-anchor="middle">context map transforms success and preserves failure</text><rect class="obj" x="55" y="65" width="170" height="70" rx="14"/><rect class="obj" x="595" y="65" width="170" height="70" rx="14"/><line class="arrow" x1="225" y1="100" x2="595" y2="100"/><text x="140" y="107" text-anchor="middle">success 3</text><text x="680" y="107" text-anchor="middle">success 4</text><text x="410" y="87" text-anchor="middle">map increment</text><rect class="obj" x="55" y="190" width="170" height="70" rx="14"/><rect class="obj" x="595" y="190" width="170" height="70" rx="14"/><line class="arrow failed" x1="225" y1="225" x2="595" y2="225"/><text x="140" y="232" text-anchor="middle">failure: bad</text><text x="680" y="232" text-anchor="middle">failure: bad</text><text x="410" y="212" text-anchor="middle">payload skipped</text><circle class="token" cx="205" cy="120" r="9"/></svg>