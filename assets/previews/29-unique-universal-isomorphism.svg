<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:monospace;fill:rgb(192,202,245)}.obj{fill:rgb(31,35,53);stroke:rgb(122,162,247);stroke-width:3}.arrow{marker-end:url(\23 arrowhead);stroke:rgb(158,206,106);stroke-width:4;fill:none}.bad{marker-end:url(\23 arrowhead);stroke:rgb(247,118,142);stroke-width:3;stroke-dasharray:8 6}.token{fill:rgb(247,118,142);animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(390px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(390px)}}</style><rect width="860" height="330" fill="rgb(26,27,38)"/><rect class="obj" x="85" y="65" width="200" height="70" rx="13"/><rect class="obj" x="575" y="65" width="200" height="70" rx="13"/><rect class="obj" x="330" y="245" width="200" height="55" rx="13"/><path class="arrow" d="M285 82C380 25 480 25 575 82"/><path class="arrow" d="M575 120C480 180 380 180 285 120"/><line class="arrow" x1="230" y1="135" x2="380" y2="245"/><line class="arrow" x1="630" y1="135" x2="480" y2="245"/><path class="bad" d="M285 100L575 100"/><text x="185" y="107" text-anchor="middle">P = pairs</text><text x="675" y="107" text-anchor="middle">Q = swapped storage</text><text x="430" y="42" text-anchor="middle">forced u</text><text x="430" y="190" text-anchor="middle">forced v; inverse both ways</text><text x="430" y="278" text-anchor="middle">same projections</text><circle class="token" cx="225" cy="70" r="8"/></svg>