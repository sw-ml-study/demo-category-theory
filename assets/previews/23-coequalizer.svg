<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.bad{stroke:#f7768e}.token{fill:#f7768e;animation:coeq 3s infinite alternate}@keyframes coeq{to{transform:translateX(410px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(410px)}}</style><rect width="880" height="320" fill="#1a1b26"/><text x="440" y="28" text-anchor="middle">coequalizer merges exactly the outputs forced equal by parallel arrows</text><rect class="obj" x="40" y="80" width="150" height="75" rx="14"/><rect class="obj" x="340" y="80" width="190" height="75" rx="14"/><rect class="obj" x="690" y="80" width="150" height="75" rx="14"/><line class="arrow" x1="190" y1="100" x2="340" y2="100"/><line class="arrow" x1="190" y1="135" x2="340" y2="135"/><line class="arrow" x1="530" y1="117" x2="690" y2="117"/><text x="115" y="124" text-anchor="middle">A = [0,1]</text><text x="435" y="124" text-anchor="middle">B = [0,1,2]</text><text x="765" y="124" text-anchor="middle">Q = one class</text><rect class="obj" x="245" y="225" width="390" height="60" rx="14"/><line class="arrow bad" x1="440" y1="205" x2="440" y2="225"/><text x="440" y="262" text-anchor="middle">bad map [7,8,7] separates a forced pair</text><circle class="token" cx="170" cy="155" r="9"/></svg>