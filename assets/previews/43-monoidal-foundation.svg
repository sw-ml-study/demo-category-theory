<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img"><title>finite monoidal coherence</title><desc>A pentagon shows a green two-arrow route and blue three-arrow route between the same four-value tensor nestings. A triangle shows associator then left unitor against right unitor tensor identity. A dashed red endpoint changes the final value and fails coherence.</desc><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><style>text{font-family:monospace;fill:rgb(192,202,245)}.obj{fill:rgb(31,35,53);stroke:rgb(122,162,247);stroke-width:3}.upper{marker-end:url(\23 arrowhead);stroke:rgb(158,206,106);stroke-width:4;fill:none}.lower{marker-end:url(\23 arrowhead);stroke:rgb(125,207,255);stroke-width:4;fill:none}.bad{marker-end:url(\23 arrowhead);stroke:rgb(247,118,142);stroke-width:4;stroke-dasharray:10 7}.token{fill:rgb(247,118,142);animation:p 4s infinite alternate}@keyframes p{to{transform:translate(390px,-130px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translate(390px,-130px)}}</style><rect width="1100" height="560" fill="rgb(26,27,38)"/><text x="550" y="28" text-anchor="middle">PENTAGON: TWO DIFFERENT REASSOCIATION ROUTES</text><rect class="obj" x="45" y="215" width="190" height="58" rx="12"/><text x="140" y="250" text-anchor="middle">(((A⊗B)⊗C)⊗D)</text><rect class="obj" x="455" y="70" width="190" height="58" rx="12"/><text x="550" y="105" text-anchor="middle">((A⊗B)⊗(C⊗D))</text><rect class="obj" x="865" y="215" width="190" height="58" rx="12"/><text x="960" y="250" text-anchor="middle">A⊗(B⊗(C⊗D))</text><rect class="obj" x="285" y="330" width="190" height="58" rx="12"/><text x="380" y="365" text-anchor="middle">((A⊗(B⊗C))⊗D)</text><rect class="obj" x="625" y="330" width="190" height="58" rx="12"/><text x="720" y="365" text-anchor="middle">A⊗((B⊗C)⊗D)</text><path class="arrow" marker-end="url(\23 arrowhead)" stroke="rgb(158,206,106)" stroke-width="4" fill="none" d="M235 225L455 115"/><path class="arrow upper" d="M645 115L865 225"/><path class="arrow lower" d="M210 273L310 330"/><path class="arrow lower" d="M475 360H625"/><path class="arrow lower" d="M790 330L890 273"/><circle class="token" cx="215" cy="215" r="8"/><text x="550" y="420" text-anchor="middle">TRIANGLE: α THEN λ = ρ TENSOR id</text><path class="arrow upper" d="M255 475H500"/><path class="arrow lower" d="M600 475H845"/><text x="165" y="482" text-anchor="middle">((A⊗I)⊗B)</text><text x="550" y="482" text-anchor="middle">A⊗(I⊗B)</text><text x="935" y="482" text-anchor="middle">A⊗B</text><line class="bad" x1="865" y1="300" x2="1010" y2="360"/><text x="935" y="400" text-anchor="middle">changed D → 8 fails</text></svg>