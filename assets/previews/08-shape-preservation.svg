<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img"><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{stroke:#9ece6a;stroke-width:4}.token{fill:#f7768e;animation:p 3s infinite alternate}@keyframes p{to{transform:translateX(420px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translateX(420px)}}</style><rect width="800" height="300" fill="#1a1b26"/><text x="400" y="28" text-anchor="middle">map changes cells, not the 2 x 3 container</text><rect class="obj" x="70" y="70" width="210" height="150" rx="14"/><rect class="obj" x="520" y="70" width="210" height="150" rx="14"/><line class="arrow" x1="280" y1="145" x2="520" y2="145"/><text x="400" y="130" text-anchor="middle">each(+1)</text><text x="175" y="125" text-anchor="middle">1 2 3</text><text x="175" y="165" text-anchor="middle">4 5 6</text><text x="625" y="125" text-anchor="middle">2 3 4</text><text x="625" y="165" text-anchor="middle">5 6 7</text><text x="175" y="205" text-anchor="middle">shape 2 x 3</text><text x="625" y="205" text-anchor="middle">shape 2 x 3</text><circle class="token" cx="260" cy="165" r="9"/></svg>