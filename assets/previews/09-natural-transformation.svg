<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img"><title>render</title><desc>Blue outlined containers are categorical objects; labeled directed arrows are morphisms; circular tokens are elements. Dashed paths and text labels distinguish failures without relying on color.</desc><style>text{font-family:monospace;fill:#c0caf5}.obj{fill:#1f2335;stroke:#7aa2f7;stroke-width:3}.arrow{fill:none;stroke:#7aa2f7;stroke-width:4}.token{fill:#f7768e;animation:p 4s infinite alternate}.good{fill:none;stroke:#9ece6a;stroke-width:7}.bad{fill:none;stroke:#f7768e;stroke-width:7}@keyframes p{to{transform:translate(170px,150px)}}@media(prefers-reduced-motion:reduce){.token{animation:none;transform:translate(170px,150px)}}</style><rect width="900" height="380" fill="#1a1b26"/><text x="450" y="28" text-anchor="middle" font-size="19">transpose is natural: every cellwise map commutes with the component</text><g><text x="220" y="55" text-anchor="middle">2x3 component</text><rect class="obj" x="80" y="75" width="120" height="60" rx="12"/><rect class="obj" x="280" y="75" width="120" height="60" rx="12"/><rect class="obj" x="80" y="255" width="120" height="60" rx="12"/><rect class="obj" x="280" y="255" width="120" height="60" rx="12"/><path class="arrow" d="M200 105H280M140 135V255M340 135V255M200 285H280"/><text x="240" y="95">each(f)</text><text x="95" y="200">T</text><text x="350" y="200">T</text><circle class="good" cx="340" cy="285" r="24"/><circle class="token" cx="140" cy="105" r="9"/></g><g transform="translate(440 0)"><text x="220" y="55" text-anchor="middle">broken component</text><rect class="obj" x="80" y="75" width="120" height="60" rx="12"/><rect class="obj" x="280" y="75" width="120" height="60" rx="12"/><rect class="obj" x="80" y="255" width="120" height="60" rx="12"/><rect class="obj" x="280" y="255" width="120" height="60" rx="12"/><path class="arrow" d="M200 105H280M140 135V255M340 135V255M200 285H280"/><text x="240" y="95">each(x2)</text><text x="80" y="200">T,+1</text><circle class="bad" cx="325" cy="285" r="21"/><circle class="bad" cx="365" cy="285" r="21"/><text x="325" y="291" text-anchor="middle">3</text><text x="365" y="291" text-anchor="middle">4</text></g><text x="450" y="355" text-anchor="middle">green = naturality; red = first cell differs after one bad component</text></svg>